[project]
name = "mockpod"
version = "0.1.0"
description = "Run mock RPM builds in Podman with local repo management"
authors = [
    { name = "Jiri Kyjovsky", email = "j1.kyjovsky@gmail.com" },
]
keywords = ["mock", "podman", "rpm", "build", "container"]
readme = "README.md"
license = "GPL-3.0-or-later"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/nikromen/mockpod"
Repository = "https://github.com/nikromen/mockpod"
Issues = "https://github.com/nikromen/mockpod/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
mockpod = "mockpod.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
